version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule: { interval: weekly }
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: "/frontend"
    schedule: { interval: weekly }
    ignore:
      # Majors that need deliberate migration work: TypeScript 7 (new compiler) and ESLint 10 (plugin support).
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: "/"
    schedule: { interval: weekly }
    ignore:
      # Odd-numbered Node releases are never LTS; move between LTS lines deliberately.
      - dependency-name: node
        versions: ["25.x", "27.x"]
