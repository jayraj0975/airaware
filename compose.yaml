# AirAware: the one deployment definition, used on a laptop and on a server.
#
#   docker compose up -d                      the site on http://localhost:8000 only
#   docker compose --profile quick up -d      + temporary public HTTPS address (Cloudflare quick tunnel, no account;
#                                               the address changes whenever the tunnel restarts; laptop demos only)
#   docker compose --profile named up -d      + permanent HTTPS address (Cloudflare named tunnel; needs TUNNEL_TOKEN
#                                               in .env; use this on the server, see docs/DEPLOYMENT.md)
#   docker compose --profile mongo up -d      + MongoDB for pollution reports (set AIRAWARE_MONGO_URL in .env)
#   docker compose down                       stop (data stays in the airaware-data volume)
#
# Settings come from .env (copy .env.example). Never commit .env.
services:
  airaware:
    build: .
    image: airaware:latest
    ports: ["127.0.0.1:8000:8000"]           # this machine only; the public way in is the tunnel
    environment:
      AIRAWARE_TRUSTED_PROXIES: 172.30.0.20   # only the tunnel may report a visitor's real address
      AIRAWARE_SECURE_COOKIES: ${AIRAWARE_SECURE_COOKIES:-1}
      AIRAWARE_PUBLIC_URL: ${AIRAWARE_PUBLIC_URL:-}
      OPENAQ_API_KEY: ${OPENAQ_API_KEY:-}
      AIRAWARE_SMTP_HOST: ${AIRAWARE_SMTP_HOST:-}
      AIRAWARE_SMTP_PORT: ${AIRAWARE_SMTP_PORT:-587}
      AIRAWARE_SMTP_USER: ${AIRAWARE_SMTP_USER:-}
      AIRAWARE_SMTP_PASSWORD: ${AIRAWARE_SMTP_PASSWORD:-}
      AIRAWARE_SMTP_FROM: ${AIRAWARE_SMTP_FROM:-}
      AIRAWARE_MONGO_URL: ${AIRAWARE_MONGO_URL:-}   # empty: reports stay in SQLite
      AIRAWARE_MONGO_DB: ${AIRAWARE_MONGO_DB:-airaware}
    volumes: ["airaware-data:/app/data"]     # database, refreshed data, daily backups
    networks: { airaware-net: { ipv4_address: 172.30.0.10 } }
    restart: unless-stopped

  mongo:
    profiles: [mongo]
    image: mongo:7
    environment:   # optional login; when set, put the same user and password in AIRAWARE_MONGO_URL
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-}
    volumes: ["mongo-data:/data/db"]           # reports survive restarts
    networks: { airaware-net: { ipv4_address: 172.30.0.30 } }   # no published port: only the app can reach it
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  tunnel-quick:
    profiles: [quick]
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --url http://172.30.0.10:8000
    networks: { airaware-net: { ipv4_address: 172.30.0.20 } }
    depends_on: { airaware: { condition: service_healthy } }
    restart: unless-stopped

  tunnel-named:
    profiles: [named]
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}               # from .env; cloudflared refuses to start without it
    networks: { airaware-net: { ipv4_address: 172.30.0.20 } }
    depends_on: { airaware: { condition: service_healthy } }
    restart: unless-stopped

networks:
  airaware-net:
    ipam: { config: [{ subnet: 172.30.0.0/24 }] }
volumes:
  airaware-data:
  mongo-data:
