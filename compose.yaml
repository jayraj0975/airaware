services:
  airaware:
    build: .
    ports: ["8000:8000"]
    environment:
      OPENAQ_API_KEY: ${OPENAQ_API_KEY:-}                   # optional: live hourly CPCB readings
      AIRAWARE_SECURE_COOKIES: ${AIRAWARE_SECURE_COOKIES:-0} # set to 1 behind HTTPS
      AIRAWARE_SMTP_HOST: ${AIRAWARE_SMTP_HOST:-}           # optional: email alerts
    volumes: ["airaware-data:/app/data"]
    restart: unless-stopped
volumes:
  airaware-data:
